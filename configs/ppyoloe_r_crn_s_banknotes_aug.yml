# PP-YOLOE-R-s con:
#   - train ampliado: 355 originales + 710 copias aumentadas offline (augmented/, rotacion/shear/
#     perspectiva/traslacion) = 1065 imagenes -> annotations/train_plus_aug.json (scripts/add_augmented.py)
#   - augmentacion online tipo Ultralytics (mosaico + escala + traslacion + HSV, scripts/obb_aug.py)
#   - 40 epocas (266 iter/epoca con batch 4 -> ~10.6k iteraciones), mosaico hasta la epoca 34
# Lanzar con el wrapper que registra los operadores OBB:
#   python scripts/train.py -c configs/ppyoloe_r_crn_s_banknotes_aug.yml --eval -o save_dir=output_aug
_BASE_: ['ppyoloe_r_crn_s_banknotes.yml', '_base_/ppyoloe_r_reader_banknotes_aug.yml']

weights: output_aug/model_final
snapshot_epoch: 4

TrainDataset:
  !COCODataSet
    image_dir: images
    anno_path: annotations/train_plus_aug.json
    dataset_dir: dataset/banknotes_obb
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

epoch: 40

LearningRate:
  base_lr: 0.004
  schedulers:
    - !CosineDecay
      max_epochs: 48
    - !LinearWarmup
      start_factor: 0.
      steps: 200
