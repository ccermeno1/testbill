# PP-YOLOE-R-s (CSPResNet-s) para deteccion de billetes de euro con oriented bounding boxes.
# Fine-tuning desde el checkpoint oficial entrenado en DOTA. Las capas cuyo tamano depende
# del numero de clases (15 en DOTA -> 1 aqui) se reinicializan automaticamente.
#
# Lanzar desde la raiz del proyecto (paddletest/):
#   python PaddleDetection/tools/train.py -c configs/ppyoloe_r_crn_s_banknotes.yml --eval
_BASE_: [
  '../PaddleDetection/configs/runtime.yml',
  '../PaddleDetection/configs/rotate/ppyoloe_r/_base_/ppyoloe_r_crn.yml',
  '_base_/banknotes_obb.yml',
  '_base_/optimizer_banknotes.yml',
  '_base_/ppyoloe_r_reader_banknotes.yml',
]

log_iter: 10
snapshot_epoch: 5
weights: output/model_final

pretrain_weights: https://paddledet.bj.bcebos.com/models/ppyoloe_r_crn_s_3x_dota.pdparams
depth_mult: 0.33
width_mult: 0.50

# NMS: el oficial usa nms_threshold 0.1 (en DOTA los objetos rotados casi no se solapan).
# Aqui ~15% de los billetes anotados solapan con un vecino con IoU > 0.1 (fotos "Multiple"),
# asi que 0.1 suprimia detecciones correctas y limitaba el recall (~85%). 0.5 lo evita.
PPYOLOERHead:
  nms:
    name: MultiClassNMS
    nms_top_k: 2000
    keep_top_k: -1
    score_threshold: 0.1
    nms_threshold: 0.5
    normalized: False
