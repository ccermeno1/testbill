# Dataset de billetes de euro con OBB (generado por scripts/prepare_dataset.py).
# Rutas relativas a la raiz del proyecto (paddletest/), que es desde donde se lanzan
# los comandos: python PaddleDetection/tools/train.py -c configs/...
metric: RBOX
num_classes: 1

TrainDataset:
  !COCODataSet
    image_dir: images
    anno_path: annotations/train.json
    dataset_dir: dataset/banknotes_obb
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

EvalDataset:
  !COCODataSet
    image_dir: images
    anno_path: annotations/valid.json
    dataset_dir: dataset/banknotes_obb
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

# Para evaluar sobre test usar configs/ppyoloe_r_crn_s_banknotes_evaltest.yml
TestDataset:
  !ImageFolder
    anno_path: annotations/test.json
    dataset_dir: dataset/banknotes_obb
