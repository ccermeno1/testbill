# Reader con augmentacion tipo Ultralytics para OBB (operadores de scripts/obb_aug.py):
#   mosaico 2x2 (+ escala +-20 %, traslacion +-5 %) durante las primeras `mosaic_epoch` epocas,
#   despues escala/traslacion sobre imagen suelta (RRandomAffine start_epoch = mosaic_epoch),
#   jitter HSV (RandomDistort, solo imagen), flip y rotaciones como en el reader base.
# Requiere lanzar con scripts/train.py (registra los operadores) en vez de tools/train.py.
worker_num: 2
image_height: &image_height 640
image_width: &image_width 640
image_size: &image_size [*image_height, *image_width]
mosaic_epoch: &mosaic_epoch 34

TrainReader:
  sample_transforms:
    - Decode: {}
    - Poly2Array: {}
    - RMosaic: {input_size: *image_height, scale: 0.2, translate: 0.05, prob: 1.0, min_visible: 0.1}
    - RRandomAffine: {scale: 0.2, translate: 0.05, prob: 1.0, min_visible: 0.1, start_epoch: *mosaic_epoch}
    - RandomDistort: {hue: [-5, 5, 0.5], saturation: [0.4, 1.6, 0.5], contrast: [0.8, 1.2, 0.3], brightness: [0.6, 1.4, 0.5], random_apply: false, count: 4}
    - RandomRFlip: {}
    - RandomRRotate: {angle_mode: 'value', angle: [0, 90, 180, -90]}
    - RandomRRotate: {angle_mode: 'value', angle: [30, 60], rotate_prob: 0.5}
    - RResize: {target_size: *image_size, keep_ratio: True, interp: 2}
    - Poly2RBox: {filter_threshold: 2, filter_mode: 'edge', rbox_type: 'oc'}
  batch_transforms:
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadRGT: {}
    - PadBatch: {pad_to_stride: 32}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: false
  collate_batch: true
  mosaic_epoch: *mosaic_epoch

EvalReader:
  sample_transforms:
    - Decode: {}
    - Poly2Array: {}
    - RResize: {target_size: *image_size, keep_ratio: True, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 4
  collate_batch: false

TestReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: *image_size, keep_ratio: True, interp: 3}   # INTER_AREA: sin aliasing al reducir fotos grandes
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_transforms:
    - PadBatch: {pad_to_stride: 32}
  batch_size: 4
