# PP-YOLOE-R-s con train ampliado con el dataset externo "Euro Banknote Detection" (304 imagenes
# tras quitar duplicados con nuestros datasets, primeros planos y fotos sin billete; 12 clases de
# billete fusionadas en euro_banknote, clase hand descartada) + augmentacion online tipo Ultralytics.
# SIN las copias offline (augmented/), para aislar el efecto de los datos nuevos.
#   train = 355 originales + 304 extra = 659 imgs / 1918 cajas  (annotations/train_plus_extra.json)
#   60 epocas (165 iter/epoca, ~9.9k iteraciones), mosaico hasta la epoca 50, coseno hasta 72
# Lanzar con el wrapper (registra RMosaic/RRandomAffine):
#   python scripts/train.py -c configs/ppyoloe_r_crn_s_banknotes_extra.yml --eval -o save_dir=output_extra
_BASE_: ['ppyoloe_r_crn_s_banknotes_aug.yml']

weights: output_extra/model_final
snapshot_epoch: 5

TrainDataset:
  !COCODataSet
    image_dir: images
    anno_path: annotations/train_plus_extra.json
    dataset_dir: dataset/banknotes_obb
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd', 'gt_poly']

epoch: 60

LearningRate:
  base_lr: 0.004
  schedulers:
    - !CosineDecay
      max_epochs: 72
    - !LinearWarmup
      start_factor: 0.
      steps: 200

TrainReader:
  sample_transforms:
    - Decode: {}
    - Poly2Array: {}
    - RMosaic: {input_size: 640, scale: 0.2, translate: 0.05, prob: 1.0, min_visible: 0.1}
    - RRandomAffine: {scale: 0.2, translate: 0.05, prob: 1.0, min_visible: 0.1, start_epoch: 50}
    - RandomDistort: {hue: [-5, 5, 0.5], saturation: [0.4, 1.6, 0.5], contrast: [0.8, 1.2, 0.3], brightness: [0.6, 1.4, 0.5], random_apply: false, count: 4}
    - RandomRFlip: {}
    - RandomRRotate: {angle_mode: 'value', angle: [0, 90, 180, -90]}
    - RandomRRotate: {angle_mode: 'value', angle: [30, 60], rotate_prob: 0.5}
    - RResize: {target_size: [640, 640], keep_ratio: True, interp: 2}
    - Poly2RBox: {filter_threshold: 2, filter_mode: 'edge', rbox_type: 'oc'}
  batch_transforms:
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadRGT: {}
    - PadBatch: {pad_to_stride: 32}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: false
  collate_batch: true
  mosaic_epoch: 50
