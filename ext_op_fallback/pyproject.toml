[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ext-op-fallback"
version = "0.1.0"
description = "Fallback en Paddle puro de las ops custom rbox_iou / matched_rbox_iou de PaddleDetection (para PP-YOLOE-R sin compilar ppdet/ext_op)"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["ext_op"]
