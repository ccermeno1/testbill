[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testbank"
version = "0.1.0"
description = "Banknote localization by single-stage OBB detection: inference and app"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "opencv-python-headless>=4.9",
]

# No AGPL/GPL anywhere. See README, section Licenses.
[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.98", "ruff>=0.3"]
# The own candidates (YOLOX-OBB variants, DDGRCF port) need only torch.
torch = ["torch>=2.2"]
# The Streamlit front end (`testbank app`). Apache-2.0. Only `testbank.app`
# imports it; nothing in the library or the CLI depends on it.
app = ["streamlit>=1.35"]
# Rotated FCOS runs from oriented-det: pure torch, but it pins numpy<2, so it
# goes in its own environment. `--only-binary=:all:` on install (README).
orienteddet = ["oriented-det>=0.2.0", "numpy<2"]

[project.scripts]
testbank = "testbank.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/testbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::testbank.geometry.quad.QuadShapeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
