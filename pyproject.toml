[project]
name = "obb-compare"
version = "0.1.0"
description = "App Streamlit y notebook para comparar detectores OBB exportados a ONNX (YOLOX-OBB, PP-YOLOE-R, RTMDet-R)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "pillow-heif>=0.16",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "streamlit>=1.40",
    "pandas>=2.0",
    # Grad-CAM: el ONNX se convierte a torch para tener gradientes
    "torch>=2.2",
    "onnx2torch>=1.5",
    "torchvision",  # la pide onnx2torch; se declara para sacarla del mismo índice CPU en Linux
    # notebook de métricas
    "matplotlib>=3.8",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[tool.uv]
package = false

# En Linux, PyPI trae torch con CUDA (~2 GB); aquí basta la versión CPU.
# En Windows y macOS la de PyPI ya es CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
