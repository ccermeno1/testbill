[project]
name = "yolox-obb-banknotes"
version = "0.1.0"
description = "Pure-PyTorch YOLOX-OBB-s oriented banknote detector"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    "pillow-heif==1.7.0",
    "torch==2.14.0",
]

[project.optional-dependencies]
export = [
    "onnx==1.23.0",
    "onnxscript==0.7.2",
    "onnxruntime==1.30.0",
]
monitoring = [
    "setuptools==80.9.0",
    "tensorboard==2.20.0",
]
test = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
